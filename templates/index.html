<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Flower Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 480px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 5px 20px #0001;
        }

        h1 {
            color: #3730a3;
            text-align: center;
        }

        p {
            color: #555;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: 0;
            border-radius: 7px;
            background: #4338ca;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            padding: 14px;
            margin-top: 20px;
            border-radius: 8px;
            background: #dcfce7;
            color: #166534;
            text-align: center;
        }

        .error {
            padding: 12px;
            margin-top: 20px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
        }

        .health {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #4338ca;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Iris Flower Classifier</h1>

        <p>Enter the flower measurements in centimetres.</p>

        <form method="POST">
            <label>Sepal Length (cm)</label>
            <input type="number" step="any" min="0.01" max="10"
                   name="sepal_length"
                   value="{{ values[0] }}" required>

            <label>Sepal Width (cm)</label>
            <input type="number" step="any" min="0.01" max="10"
                   name="sepal_width"
                   value="{{ values[1] }}" required>

            <label>Petal Length (cm)</label>
            <input type="number" step="any" min="0.01" max="10"
                   name="petal_length"
                   value="{{ values[2] }}" required>

            <label>Petal Width (cm)</label>
            <input type="number" step="any" min="0.01" max="10"
                   name="petal_width"
                   value="{{ values[3] }}" required>

            <button type="submit">Predict Flower Species</button>
        </form>

        {% if prediction %}
            <div class="result">
                <strong>Predicted species: {{ prediction }}</strong>
            </div>
        {% endif %}

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <a class="health" href="/health">Check Application Health</a>
    </div>
</body>
</html>
